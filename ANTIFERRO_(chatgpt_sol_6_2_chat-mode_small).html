}
fn shapeCore(p:vec3f)->f32{return tor(p,1.05,.16)+.06*spin(p,u.time);}

function frame(){if(!active)return;try{let t=time();if(t>=duration){finish();return;}let s=part(t),local=(t-bars[s]*4*B)/((bars[s+1]-bars[s])*4*B),m=s===13?Math.max(0,(local-.88)/.12):Math.max(0,(local-.72)/.28);m=m*m*(3-2*m);analyser.getByteFrequencyData(freq);let bass=0,high=0;for(let i=0;i<8;i++)bass+=freq[i]/2040;for(let i=20;i<80;i++)high+=freq[i]/15300;data.set([cv.width,cv.height,t,t/B,s,m,local,s===10?.15:1,quality,bass,high,0]);gpu.queue.writeBuffer(ub,0,data);let enc=gpu.createCommandEncoder();let p=enc.beginRenderPass({colorAttachments:[{view:tex.createView(),loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}]});p.setPipeline(pipe);p.setBindGroup(0,bg);p.draw(3);p.end();p=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:[0,0,0,1]}]});p.setPipeline(post);p.setBindGroup(0,pbg);p.draw(3);p.end();gpu.queue.submit([enc.finish()]);if(!hud.hidden)hud.textContent=`${names[s]}  ${t.toFixed(1)} / ${duration.toFixed(1)} s\n${cv.width} × ${cv.height}  |  ${BPM} BPM`;raf=requestAnimationFrame(frame);}catch(e){fail(e);}}

$('start').onclick=async()=>{try{$('start').disabled=true;$('err').textContent='Initialisierung …';quality=+$('quality').value;if(!ac)audio();await ac.resume();if(!pipe||!pbg)await initGPU();else resize();active=true;playing=true;seek(0);clearInterval(timer);timer=setInterval(schedule,25);menu.hidden=true;document.body.style.cursor='none';$('err').textContent='';frame();}catch(e){fail(e);}};addEventListener('resize',()=>{try{resize();}catch(e){fail(e);}});addEventListener('keydown',async e=>{if(e.key.toLowerCase()==='f'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{}return;}if(!active)return;let k=e.key.toLowerCase();if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='m'){muted=!muted;master.gain.setTargetAtTime(muted?0:.65,ac.currentTime,.03);}if(k===' '){if(playing){offset=time();playing=false;stopNodes();}else{playing=true;seek(offset);}}if(k==='r')seek(0);if(k==='arrowleft'||k==='arrowright'){let s=part(time());seek(bars[Math.max(0,Math.min(13,s+(k==='arrowleft'?-1:1)))]*4*B);}if(k==='q'){let a=[480,720,1080,1440];quality=a[(a.indexOf(quality)+1)%4];$('quality').value=quality;resize();}if(k==='h')hud.hidden=!hud.hidden;if(k==='escape')finish();});let cursorTimer;addEventListener('mousemove',()=>{document.body.style.cursor='';clearTimeout(cursorTimer);if(active)cursorTimer=setTimeout(()=>{if(active)document.body.style.cursor='none';},1800);});
</script></html>
