<!DOCTYPE html>

<style>

    width: 100%; height: 100%;

  #help { margin-top:16px; color:#94a3b8; font-size:12px; text-align:center; line-height:1.8; }
  #hud { position:fixed; top:12px; left:12px; color:#d5f7ff; background:#07111cbb; padding:10px; font:12px monospace; white-space:pre; pointer-events:none; display:none; }
  body.playing { cursor:none; }

<div id="overlay">

  <div id="help">F Fullscreen · Space Pause · M Mute · R Restart · Q Quality · ←/→ Chapter · H Diagnostics · N New Universe · Esc Menu</div><div id="error"></div>
</div><div id="hud"></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const quality = document.getElementById('quality'), hud = document.getElementById('hud');
  const fail = msg => { document.getElementById('error').textContent = String(msg); overlay.classList.remove('hidden'); document.body.classList.remove('playing'); startBtn.disabled = true; };
  canvas.addEventListener('webglcontextlost', e => {e.preventDefault(); fail('WebGL context lost. Reload the file.');});

  const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
  if (!gl) {
    document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:sans-serif">WebGL2 is required.</div>';
    return;
  }

  function resize() {
    const nativeH = Math.max(1, Math.round(window.innerHeight * (window.devicePixelRatio || 1)));
    const h = Number(quality.value) || nativeH;
    canvas.height = h;
    canvas.width = Math.max(1,Math.round(h * window.innerWidth / Math.max(1,window.innerHeight)));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener('resize', resize); quality.addEventListener('change',resize);
  resize();

  const vsSrc = `#version 300 es
    in vec2 aPos;
    void main() {
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  // Shared exact SDF math between JS (camera navigation) and GLSL (raymarching)
  // Plus a smooth carved flight corridor along the spine path so no closed wall ever blocks the camera,
  // while open holes, arches, rings, and floating structures surround the flight path cleanly!
  const fsSrc = `#version 300 es
    precision highp float;

    uniform vec2 uRes;
    uniform float uTime;
    uniform float uBeat;
    uniform float uBass;
    uniform float uMid;
    uniform float uHigh;
    uniform vec3 uCamPos;
    uniform vec3 uCamFwd;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform vec4 uRoute; // x/y amplitude, phase, safety radius
    uniform vec4 uPart; // architecture A, B, transition, local progress
    uniform vec4 uStyle; // focal length, warp, event pulse, intensity
    uniform float uTravel;
    uniform vec4 uEvolution; // weight, palette, deformation, material
    uniform vec4 uEvent; // aurora, shockwave, shards, lens

    out vec4 fragColor;

    mat2 rot(float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c);
    }

    float sdBox(vec3 p, vec3 b) {
      vec3 q = abs(p) - b;
      return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
    }

    float sdTorus(vec3 p, vec2 t) {
      vec2 q = vec2(length(p.xy) - t.x, p.z);
      return length(q) - t.y;
    }

    float sdOctahedron(vec3 p, float s) {
      p = abs(p);
      return (p.x + p.y + p.z - s) * 0.57735027;
    }

    float smin(float a, float b, float k) {
      float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
      return mix(b, a, h) - k * h * (1.0 - h);
    }

    float smax(float a, float b, float k) {
      return -smin(-a, -b, k);
    }

    // Exact spine centerline matching JS camera spine
    vec2 spineXY(float z) {
      return vec2(
        sin(z * 0.055) * 2.2 + cos(z * 0.027) * 1.1,
        cos(z * 0.048) * 1.6 + sin(z * 0.023) * 0.9
      );
    }

    vec2 routeXY(float z) {
      return spineXY(z) + vec2(uRoute.x * sin(z*.115 + uRoute.z), uRoute.y * cos(z*.093 + uRoute.z*.73));
    }
    float spinField(vec3 p) {
      return (sin(dot(p,vec3(2.2,.8,1.45))-uTime*3.1) + sin(dot(p,vec3(-1.35,1.9,2.7))-uTime*5.8) + .55*sin(length(p.xy-spineXY(p.z))*5.0+p.z*.65-uTime*2.0))/2.55;
    }
    // 16 distinct architectural SDFs centered around spine(p.z)
    float sceneArch(int id, vec3 p, float z, vec2 sp) {
      vec3 q = vec3(p.xy - sp, p.z);

      if (id == 0) {
        // 0: Hexagonal Cathedral Ribbed Tunnel (open center)
        float cz = mod(z + 4.0, 8.0) - 4.0;
        vec2 a = abs(q.xy);
        float hex = max(a.x * 0.866025 + a.y * 0.5, a.y) - 4.2;
        float ring = max(abs(hex)-0.18, abs(cz) - 0.55);
        float pillars = length(abs(q.xy) - vec2(3.3, 2.2)) - 0.42;
        return min(ring, pillars);
      }
      if (id == 1) {
        // 1: Floating Megalith Archipelago & Crystal Ring
        float cz = mod(z + 6.0, 12.0) - 6.0;
        vec3 rp = vec3(q.xy, cz);
        rp.xy *= rot(floor((z + 6.0) / 12.0) * 0.7 + uTime * 0.15);
        float c1 = sdOctahedron(rp - vec3(2.9, 1.6, 0.0), 1.05 + uBass * 0.2);
        float c2 = sdOctahedron(rp + vec3(2.8, 1.8, 1.5), 0.95);
        float floorWave = q.y + 3.4 - sin(q.x * 0.7 + z * 0.3) * 0.45;
        return min(min(c1, c2), floorWave);
      }
      if (id == 2) {
        // 2: DNA Double-Helix Bridge
        float ang = z * 0.42 + uTime * 0.4;
        vec2 h1 = vec2(cos(ang), sin(ang)) * 3.1;
        vec2 h2 = -h1;
        float s1 = length(q.xy - h1) - 0.62;
        float s2 = length(q.xy - h2) - 0.62;
        float cz = mod(z + 2.5, 5.0) - 2.5;
        vec3 bp = vec3(q.xy, cz);
        bp.xy *= rot(ang);
        float rung = sdBox(bp, vec3(3.1, 0.18, 0.18));
        return min(min(s1, s2), rung);
      }
      if (id == 3) {
        // 3: Open KIFS / Mandelbox Sanctuary (hollowed core)
        float cz = mod(z + 5.0, 10.0) - 5.0;
        vec3 fp = vec3(q.xy, cz);
        fp.xy *= rot(0.35);
        for (int i = 0; i < 3; i++) {
          fp = abs(fp) - vec3(2.3, 2.1, 1.6);
          fp.xy *= rot(0.52);
          fp.yz *= rot(0.38);
        }
        return sdBox(fp, vec3(0.75, 0.75, 0.75));
      }
      if (id == 4) {
        // 4: Concentric Astrolabe Gyroscopes
        float cz = mod(z + 7.0, 14.0) - 7.0;
        vec3 gp = vec3(q.xy, cz);
        vec3 g1 = gp; g1.xz *= rot(uTime * 0.55);
        vec3 g2 = gp; g2.yz *= rot(-uTime * 0.45);
        float t1 = sdTorus(g1, vec2(3.6, 0.24));
        float t2 = sdTorus(g2, vec2(2.7, 0.20));
        return min(t1, t2);
      }
      if (id == 5) {
        // 5: Infinite Gothic Cyber-Arches
        float cz = mod(z + 4.5, 9.0) - 4.5;
        vec2 ap = vec2(abs(q.x), q.y);
        float arch = abs(length(ap - vec2(-1.4, 0.2)) - 4.5) - 0.35;
        float frame = max(arch, abs(cz) - 0.48);
        float floorP = q.y + 3.5;
        return min(frame, floorP);
      }
      if (id == 6) {
        // 6: Crystalline Geode Cavern
        float cz = mod(z + 4.0, 8.0) - 4.0;
        vec3 gp = vec3(q.xy, cz);
        gp.xy *= rot(z * 0.08);
        float shell = -(length(gp.xy) - 4.6);
        vec3 spk = abs(gp) - vec3(2.6, 2.4, 1.4);
        float spikes = sdOctahedron(spk, 1.35);
        return max(shell, -spikes * 0.25) * 0.5 + min(spikes, max(shell, abs(cz) - 1.8)) * 0.5;
      }
      if (id == 7) {
        // 7: Hypercube Tesseract Frame Matrix
        float cz = mod(z + 6.0, 12.0) - 6.0;
        vec3 hp = vec3(q.xy, cz);
        hp.xy *= rot(uTime * 0.25 + floor((z + 6.0)/12.0));
        float outer = max(sdBox(hp, vec3(3.4)), -sdBox(hp, vec3(2.95, 2.95, 4.0)));
        float inner = max(sdBox(hp, vec3(2.3)), -sdBox(hp, vec3(1.95, 1.95, 3.2)));
        return min(outer, inner);
      }
      if (id == 8) {
        // 8: Liquid Chrome Sine-Wave Canyon
        float wave = sin(q.x * 0.85 + uTime * 1.4) * cos(z * 0.45) * 0.85;
        float floorS = q.y + 2.8 + wave;
        float ceilS = -q.y + 3.4 + wave * 0.7;
        float cz = mod(z + 5.0, 10.0) - 5.0;
        float orb = length(vec3(q.x - sin(z * 0.3) * 2.5, q.y - 0.5, cz)) - 0.75;
        return min(min(floorS, ceilS), orb);
      }
      if (id == 9) {
        // 9: Dyson Sphere Orbital Rings
        float cz = mod(z + 7.5, 15.0) - 7.5;
        vec3 dp = vec3(q.xy, cz);
        dp.xy *= rot(0.5);
        dp.yz *= rot(0.35 + uTime * 0.2);
        float r1 = sdTorus(dp, vec2(4.0, 0.26));
        dp.xz *= rot(1.1);
        float r2 = sdTorus(dp, vec2(3.1, 0.22));
        return min(r1, r2);
      }
      if (id == 10) {
        // 10: Origami Folded Ribbon Nebula
        vec3 op = vec3(q.xy, 0.0);
        op.xy *= rot(z * 0.16 + sin(z * 0.1) * 0.5);
        float r1 = sdBox(op - vec3(2.9, 0.0, 0.0), vec3(0.18, 1.6, 100.0));
        float r2 = sdBox(op + vec3(2.9, 0.0, 0.0), vec3(0.18, 1.6, 100.0));
        return min(r1, r2);
      }
      if (id == 11) {
        // 11: Sierpinski-Style Frame Colonnade
        float cz = mod(z + 5.0, 10.0) - 5.0;
        vec3 sp = vec3(abs(q.xy), cz);
        sp.xy -= vec2(2.5, 2.1);
        float p1 = sdOctahedron(sp, 1.25);
        float bar = sdBox(vec3(q.x, abs(q.y) - 3.3, cz), vec3(3.4, 0.22, 0.35));
        return min(p1, bar);
      }
      if (id == 12) {
        // 12: Wormhole Singularity & Accretion Torus
        float cz = mod(z + 6.5, 13.0) - 6.5;
        vec3 wp = vec3(q.xy, cz);
        wp.xy *= rot(z * 0.25 - uTime * 0.6);
        float disk = sdTorus(wp, vec2(3.3, 0.28));
        float sat = length(wp - vec3(2.8, 0.0, 1.8)) - 0.55;
        return min(disk, sat);
      }
      if (id == 13) {
        // 13: Quantum Lattice Node Network
        float cz = mod(z + 4.5, 9.0) - 4.5;
        vec3 lp = vec3(abs(q.xy), cz);
        vec3 nodeP = lp - vec3(2.6, 2.0, 0.0);
        float node = length(nodeP) - (0.58 + uBeat * 0.12);
        float beamX = sdBox(vec3(q.x, lp.y - 2.0, cz), vec3(2.6, 0.12, 0.12));
        float beamY = sdBox(vec3(lp.x - 2.6, q.y, cz), vec3(0.12, 2.0, 0.12));
        return min(node, min(beamX, beamY));
      }
      if (id == 14) {
        // 14: Stained-Glass Rose Windows
        float cz = mod(z + 6.0, 12.0) - 6.0;
        vec2 rp = q.xy * rot(uTime * 0.25 + floor((z + 6.0)/12.0));
        float ang = atan(rp.y, rp.x);
        float r = length(rp);
        float petals = abs(r - (3.1 + 0.55 * cos(ang * 8.0))) - 0.24;
        return max(petals, abs(cz) - 0.35);
      }
      if(id==16){ // braided magnetic flux toroids
        float cz=mod(z+5.,10.)-5.; vec3 r=vec3(q.xy,cz);
        r.xy=rot(z*.16+uTime*.28)*r.xy;
        float a=atan(r.y,r.x), rad=length(r.xy);
        float braid=length(vec2(rad-3.2-.42*cos(a*5.+uTime),cz-.65*sin(a*5.+uTime)))-.24;
        float ring=sdTorus(r.xzy,vec2(3.5,.17)); return smin(braid,ring,.23);
      }
      if(id==17){ // hollow recursive coral spires
        float cz=mod(z+6.,12.)-6.; vec3 r=vec3(q.xy,cz);r.xy=rot(z*.09)*r.xy;
        vec3 f=r;for(int j=0;j<3;j++){f=abs(f)-vec3(2.1,1.9,1.35);f.xz=rot(.56)*f.xz;f.xy=rot(.42)*f.xy;}
        float body=sdOctahedron(f,1.12);float pores=length(sin(r*2.4))-.64;
        return smax(body,-pores*.28,.12);
      }
      if(id==18){ // magnetic liquid sheets with perforated interference nodes
        vec3 r=q;r.xy=rot(.5*sin(z*.18+uTime*.23))*r.xy;
        float w=sin(r.x*1.6+z*.42-uTime*1.4)*.56+sin(z*.71+r.x*.8+uTime*.8)*.32;
        float sheets=abs(abs(r.y)-3.1-w)-.19;
        float holes=length(vec2(mod(r.x+1.1,2.2)-1.1,mod(z+1.5,3.)-1.5))-.48;
        return smax(sheets,-holes,.12);
      }
      if(id==19){ // orbital knot / expanding cage
        float cz=mod(z+7.,14.)-7.;vec3 r=vec3(q.xy,cz);r.yz=rot(uTime*.27+z*.05)*r.yz;
        float a=atan(r.y,r.x), rr=length(r.xy);
        float knot=length(vec2(rr-3.1-.72*cos(3.*a),r.z-.92*sin(3.*a)))-.29;
        float shell=abs(length(r)-4.1)-.12;float slots=abs(sin(a*6.+r.z*.7))-.19;
        return smin(knot,max(shell,-slots*.4),.20);
      }
      if(id==20){ // folding crystalline circuit board
        float cz=mod(z+4.,8.)-4.; vec3 r=vec3(q.xy,cz);r.xy=rot(floor((z+4.)/8.)*.63+uTime*.11)*r.xy;
        vec3 f=abs(r)-vec3(2.8,2.15,1.5);f.xy=rot(.35)*f.xy;
        float c=sdOctahedron(f,1.28);float inset=sdBox(f,vec3(.29,.9,.48));
        float rails=length(abs(r.xy)-vec2(3.8,2.8))-.18;
        return min(max(c,-inset),rails);
      }
      if(id==21){ // rotating gyroid membranes
        vec3 r=q;r.xy=rot(z*.095+uTime*.12)*r.xy;
        vec3 a=r*1.25+vec3(0,0,uTime*.25);
        float gy=abs(dot(sin(a),cos(a.yzx)))-.22;
        float bounds=abs(length(r.xy)-3.65)-1.3;
        return max(gy*.38,bounds);
      }
      if(id==22){ // collapsing radial machine / aperture gates
        float cz=mod(z+5.5,11.)-5.5;vec2 r=rot(uTime*.4+z*.04)*q.xy;
        float a=atan(r.y,r.x),rad=length(r),fold=cos(a*9.+sin(cz*.7)*2.);
        float blade=max(abs(rad-3.6-.65*fold)-.23,abs(cz)-.68-.4*fold);
        float axle=sdTorus(vec3(r,cz),vec2(4.45,.18));return min(blade,axle);
      }
      if(id==23){ // inverted lattice: nested hollow diamond tunnels
        float cz=mod(z+6.,12.)-6.;vec3 r=vec3(q.xy,cz);r.xy=rot(z*.13-uTime*.22)*r.xy;
        float a=abs(sdOctahedron(r,5.2))-.15;
        float b=abs(sdOctahedron(r,3.8))-.12;
        float gaps=abs(sin(r.x*1.4+r.y*1.6+r.z*.8))-.30;
        return max(min(a,b),-gaps*.38);
      }
      // 15: Harmonic Convergence Citadel (Finale)
      float cz = mod(z + 5.5, 11.0) - 5.5;
      vec3 fp = vec3(q.xy, cz);
      fp.xy *= rot(0.4);
      vec3 kf = abs(fp) - vec3(2.4, 2.2, 1.5);
      kf.xy *= rot(0.45);
      float fractal = sdBox(kf, vec3(0.68));
      float halo = sdTorus(vec3(q.xy, cz), vec2(3.5, 0.22));
      return min(fractal, halo);
    }

    vec2 map(vec3 p) {
      float z = p.z;
      vec2 sp = spineXY(z);

      int idA = int(uPart.x), idB = int(uPart.y);
      float blend = uPart.z;
      // A continuous travelling deformation links both architectural fields.
      vec3 wp=p;
      float twist=sin(blend*3.14159265)*.30 + uEvolution.x*uEvolution.z*.45;
      wp.xy=sp+rot(twist*sin(z*.28-uTime*.8))*(p.xy-sp);
      float dA=sceneArch(idA,wp,z,sp);
      float dB=blend>.001?sceneArch(idB,wp,z,sp):dA;
      float d=mix(dA,dB,blend)-.32*sin(blend*3.14159265);
      // Every generated chapter has continuously varying scale and deformation.
      d+=uEvolution.x*.13*sin(z*.71+uTime*1.3+length(p.xy-sp)*2.6)*uEvolution.w;
      if(uEvolution.x>.001 && uEvent.z>.001){
        float cz=mod(z+4.,8.)-4.;vec3 k=vec3(p.xy-sp,cz);
        k.xy=rot(z*.36+uTime*.7)*k.xy;
        float fragment=sdOctahedron(abs(k)-vec3(3.2,2.9,1.6),.48+.40*uEvent.z);
        d=smin(d,fragment+(1.-uEvent.z)*5.,.12);
      }
      // Physical-looking spin wave displacement, deliberately small for stable tracing.
      d += .065*spinField(p)*(0.45+uBass*.55);
      // Additional braided plasma conduits, only in selected chapters.
      float ea = (idA==2 || idA==9 || idA==12 || idA==13 || idA==15) ? 1.0:0.0;
      float eb = (idB==2 || idB==9 || idB==12 || idB==13 || idB==15) ? 1.0:0.0;
      float energy=mix(ea,eb,blend);
      if(energy>0.002) {
        float a=z*.46-uTime*.85;
        vec2 o=p.xy-sp;
        float r=3.75+.30*sin(z*.24-uTime);
        float strand=min(length(o-r*vec2(cos(a),sin(a))),length(o+r*vec2(cos(a),sin(a))))-.085+(1.-energy)*5.;
        d=smin(d,strand,.14*energy+.001);
      }
      if(idA==15) {
        float rise=smoothstep(.15,.72,uPart.w)*(1.-blend);
        float zz=mod(z+5.5,11.)-5.5;
        vec3 k=vec3(p.xy-sp,zz);
        k.xy=rot(z*.14+uTime*.35)*k.xy;
        float phase=z*.37+uTime*.8;
        float satellites=length(k-vec3(3.1*cos(phase),3.1*sin(phase),0.))-(.12+.48*rise);
        float orbit=sdTorus(k.xzy,vec2(3.15,.06+.11*rise));
        d=smin(d,min(orbit,satellites)+(1.-rise)*4.,.16);
      }
      // Retain the original spine opening and add a second swept flight passage.
      // At the camera position this field is >= uRoute.w, regardless of morph or audio.
      float core=1.15-length(p.xy-sp);
      float flight=uRoute.w-length(p.xy-routeXY(z));
      d=smax(d,max(core,flight),.24);

      // Material ID based on radial distance & periodic structure
      float matId = smoothstep(2.0, 3.8, length(p.xy - sp));
      return vec2(d, matId);
    }

    vec3 calcNormal(vec3 p) {
      vec2 e = vec2(0.0035, 0.0);
